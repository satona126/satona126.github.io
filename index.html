<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>True Spatial AR Drawing (WebXR)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 30px 0;
            box-sizing: border-box;
            z-index: 10;
        }
        #instruction {
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            text-align: center;
        }
        #clear-btn {
            pointer-events: auto;
            background: #ff3b30;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: none; /* AR開始後に表示 */
        }
    </style>
</head>
<body>

    <div id="overlay">
        <div id="instruction">下の「START AR」を押して開始<br>画面を押したままスマホを動かすと空間に描けます</div>
        <button id="clear-btn">すべて消去</button>
    </div>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.150.0/build/three.module.js';
        import { ARButton } from 'https://unpkg.com/three@0.150.0/examples/jsm/webxr/ARButton.js';

        let camera, scene, renderer;
        let controller;
        let isDrawing = false;
        let currentLineMesh = null;
        let pointsArray = [];
        const linesGroup = new THREE.Group();

        // ペン先の位置を示す小さなカーソル（スマホの少し前）
        let cursorMesh;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.add(linesGroup);

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            // WebXR（空間認識）を有効にする最重要設定
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            // ライト設定
            const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
            light.position.set(0.5, 1, 0.25);
            scene.add(light);

            // AR開始ボタンを画面下部に自動生成（DOM OverlayでUIをAR上に重ねる）
            const overlay = document.getElementById('overlay');
            const arButton = ARButton.createButton(renderer, {
                optionalFeatures: ['dom-overlay'],
                domOverlay: { root: overlay }
            });
            document.body.appendChild(arButton);

            // ペン先（スマホのカメラから25cm前方の空間）の目印を作成
            const cursorGeo = new THREE.SphereGeometry(0.008, 16, 16);
            const cursorMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.7 });
            cursorMesh = new THREE.Mesh(cursorGeo, cursorMat);
            scene.add(cursorMesh);

            // WebXRのタッチ入力コントローラー
            controller = renderer.xr.getController(0);
            controller.addEventListener('selectstart', onSelectStart);
            controller.addEventListener('selectend', onSelectEnd);
            scene.add(controller);

            // ARセッション開始・終了時のUI切り替え
            renderer.xr.addEventListener('sessionstart', () => {
                document.getElementById('instruction').innerText = '画面を長押ししながらスマホを動かそう！';
                document.getElementById('clear-btn').style.display = 'block';
            });
            renderer.xr.addEventListener('sessionend', () => {
                document.getElementById('instruction').innerHTML = '下の「START AR」を押して開始';
                document.getElementById('clear-btn').style.display = 'none';
            });

            // 消去ボタン
            document.getElementById('clear-btn').addEventListener('click', (e) => {
                e.stopPropagation(); // ボタンを押したときに線が描かれないようにする
                while (linesGroup.children.length > 0) {
                    const obj = linesGroup.children[0];
                    linesGroup.remove(obj);
                    if (obj.geometry) obj.geometry.dispose();
                    if (obj.material) obj.material.dispose();
                }
            });

            window.addEventListener('resize', onWindowResize);
        }

        // スマホのカメラから少し前方（0.25m先）のワールド空間座標を取得
        function getPenTipPosition() {
            const position = new THREE.Vector3();
            const quaternion = new THREE.Quaternion();
            const scale = new THREE.Vector3();

            // カメラの現在の空間上の位置と向きを取得
            camera.matrixWorld.decompose(position, quaternion, scale);

            // カメラの正面方向（-Z方向）に 25cm 進めた位置を計算
            const offset = new THREE.Vector3(0, 0, -0.25);
            offset.applyQuaternion(quaternion);
            position.add(offset);

            return position;
        }

        function onSelectStart() {
            isDrawing = true;
            pointsArray = [];
            const p = getPenTipPosition();
            pointsArray.push(p);
        }

        function onSelectEnd() {
            isDrawing = false;
            currentLineMesh = null;
        }

        function updateLine() {
            if (!isDrawing) return;

            const currentPos = getPenTipPosition();
            const lastPos = pointsArray[pointsArray.length - 1];

            // 前回の点から 5mm 以上スマホが動いたときだけ新しい点を追加（滑らかにするため）
            if (currentPos.distanceTo(lastPos) > 0.005) {
                pointsArray.push(currentPos);

                if (pointsArray.length >= 2) {
                    if (currentLineMesh) {
                        linesGroup.remove(currentLineMesh);
                        currentLineMesh.geometry.dispose();
                    }

                    const curve = new THREE.CatmullRomCurve3(pointsArray);
                    // 空間のスケールに合わせた太さ（半径 6mm の白いチューブ）
                    const geometry = new THREE.TubeGeometry(curve, pointsArray.length * 2, 0.006, 8, false);
                    const material = new THREE.MeshStandardMaterial({
                        color: 0xffffff,
                        roughness: 0.3
                    });

                    currentLineMesh = new THREE.Mesh(geometry, material);
                    linesGroup.add(currentLineMesh);
                }
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render() {
            // 毎フレーム、ペン先の白い点のカーソル位置を更新
            if (renderer.xr.isPresenting) {
                const tipPos = getPenTipPosition();
                cursorMesh.position.copy(tipPos);
                cursorMesh.visible = true;

                // 描画中なら線の頂点を追加
                updateLine();
            } else {
                cursorMesh.visible = false;
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
