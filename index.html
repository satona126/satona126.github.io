<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Spatial AR Drawing (Touch Mode)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 25px 0 80px 0;
            box-sizing: border-box;
            z-index: 10;
        }
        #status {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            text-align: center;
        }
        #controls {
            pointer-events: auto;
            display: none; /* AR開始後に表示 */
            gap: 15px;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 30px;
        }
        .color-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 3px solid #666;
            cursor: pointer;
            transition: transform 0.1s, border-color 0.1s;
        }
        .color-btn.active {
            border-color: #00f2fe;
            transform: scale(1.15);
        }
        #btn-white { background-color: #ffffff; }
        #btn-black { background-color: #111111; }
        #clear-btn {
            background: #ff3b30;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-left: 10px;
        }
    </style>
</head>
<body>

    <div id="overlay">
        <div id="status">下の「START AR」を押して開始</div>
        <div id="controls">
            <button id="btn-white" class="color-btn active" aria-label="白"></button>
            <button id="btn-black" class="color-btn" aria-label="黒"></button>
            <button id="clear-btn">消去</button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.150.0/build/three.module.js';
        import { ARButton } from 'https://unpkg.com/three@0.150.0/examples/jsm/webxr/ARButton.js';

        let camera, scene, renderer;
        let controller;
        let isDrawing = false;
        let currentColor = 0xffffff; // 初期色：白
        let currentRibbonMesh = null;
        let ribbonPoints = [];
        const linesGroup = new THREE.Group();

        // ペン先の目印（少し前方の平面マーカー）
        let cursorMesh;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.add(linesGroup);

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            // ライト
            const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1.2);
            scene.add(light);

            // AR開始ボタン
            const overlay = document.getElementById('overlay');
            const arButton = ARButton.createButton(renderer, {
                optionalFeatures: ['dom-overlay'],
                domOverlay: { root: overlay }
            });
            document.body.appendChild(arButton);

            // ペン先の目印（四角い平面マーカー）
            const cursorGeo = new THREE.PlaneGeometry(0.015, 0.015);
            const cursorMat = new THREE.MeshBasicMaterial({
                color: 0x00f2fe,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.8
            });
            cursorMesh = new THREE.Mesh(cursorGeo, cursorMat);
            cursorMesh.visible = false;
            scene.add(cursorMesh);

            // WebXRのタッチコントローラー設定
            controller = renderer.xr.getController(0);
            controller.addEventListener('selectstart', onSelectStart);
            controller.addEventListener('selectend', onSelectEnd);
            scene.add(controller);

            // ARセッション開始・終了時
            renderer.xr.addEventListener('sessionstart', () => {
                document.getElementById('status').innerText = '画面を長押ししながらスマホを動かそう！';
                document.getElementById('controls').style.display = 'flex';
            });

            renderer.xr.addEventListener('sessionend', () => {
                document.getElementById('status').innerText
