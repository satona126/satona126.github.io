<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Drawing</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
            touch-action: none; /* スマホの画面スクロール等を防いでタッチを確実にする */
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 30px 0 60px 0;
            box-sizing: border-box;
            z-index: 10;
        }
        #instruction {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            text-align: center;
            display: none;
        }
        #controls {
            pointer-events: auto;
            display: none;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.75);
            padding: 12px 16px;
            border-radius: 30px;
        }
        .btn {
            background: #333;
            color: white;
            border: 2px solid #555;
            padding: 8px 12px;
            border-radius: 15px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn.active {
            border-color: #00f2fe;
            background: #005f73;
        }
        .color-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 3px solid #555;
            cursor: pointer;
            padding: 0;
        }
        .color-btn.active {
            border-color: #00f2fe;
            transform: scale(1.1);
        }
        #btn-white { background-color: #ffffff; }
        #btn-black { background-color: #222222; }
        #btn-neon { 
            background: radial-gradient(circle, #ffffff 20%, #00f2fe 60%, #004466 100%);
            box-shadow: 0 0 10px #00f2fe;
        }
        #clear-btn {
            background: #ff3b30;
            border: none;
            color: white;
        }
        #ARButton {
            background: #ffffff !important;
            color: #000000 !important;
            border: none !important;
            padding: 14px 28px !important;
            border-radius: 30px !important;
            font-size: 16px !important;
            font-weight: bold !important;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3) !important;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="overlay">
        <div id="instruction">画面を長押ししながらスマホを動かす</div>
        <div id="controls">
            <!-- 色選択（白、黒、光る線） -->
            <button id="btn-white" class="color-btn active" aria-label="白"></button>
            <button id="btn-black" class="color-btn" aria-label="黒"></button>
            <button id="btn-neon" class="color-btn" aria-label="光る線"></button>
            
            <div style="width: 1px; height: 24px; background: #555; margin: 0 4px;"></div>

            <!-- 太さ選択 -->
            <button id="size-thin" class="btn">細</button>
            <button id="size-mid" class="btn active">中</button>
            <button id="size-thick" class="btn">太</button>

            <div style="width: 1px; height: 24px; background: #555; margin: 0 4px;"></div>

            <!-- 消去 -->
            <button id="clear-btn" class="btn">消去</button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.150.0/build/three.module.js';
        import { ARButton } from 'https://unpkg.com/three@0.150.0/examples/jsm/webxr/ARButton.js';

        let camera, scene, renderer;
        let controller;
        let isDrawing = false;
        let currentColor = 0xffffff;
        let isNeon = false;
        let currentLineWidth = 0.015;
        let currentRibbonMesh = null;
        let ribbonPoints = [];
        const linesGroup = new THREE.Group();
        let cursorMesh;
        let neonTexture;

        init();
        animate();

        function createNeonGlowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 1;
            const ctx = canvas.getContext('2d');

            const gradient = ctx.createLinearGradient(0, 0, 128, 0);
            gradient.addColorStop(0.0, 'rgba(0, 242, 254, 0.0)');
            gradient.addColorStop(0.25, 'rgba(0, 242, 254, 0.35)');
            gradient.addColorStop(0.42, 'rgba(120, 250, 255, 0.9)');
            gradient.addColorStop(0.5, 'rgba(255, 255, 255, 1.0)');
            gradient.addColorStop(0.58, 'rgba(120, 250, 255, 0.9)');
            gradient.addColorStop(0.75, 'rgba(0, 242, 254, 0.35)');
            gradient.addColorStop(1.0, 'rgba(0, 242, 254, 0.0)');

            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 128, 1);

            const texture = new THREE.CanvasTexture(canvas);
            texture.needsUpdate = true;
            return texture;
        }

        function init() {
            scene = new THREE.Scene();
            scene.add(linesGroup);

            neonTexture = createNeonGlowTexture();

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1.2);
            scene.add(light);

            const overlay = document.getElementById('overlay');
            const arButton = ARButton.createButton(renderer, {
                optionalFeatures: ['dom-overlay'],
                domOverlay: { root: overlay }
            });
            document.body.appendChild(arButton);

            renderer.xr.addEventListener('sessionstart', () => {
                document.getElementById('instruction').style.display = 'block';
                document.getElementById('controls').style.display = 'flex';
            });

            renderer.xr.addEventListener('sessionend', () => {
                document.getElementById('instruction').style.display = 'none';
                document.getElementById('controls').style.display = 'none';
                isDrawing = false;
            });

            const cursorGeo = new THREE.PlaneGeometry(0.015, 0.015);
            const cursorMat = new THREE.MeshBasicMaterial({
                color: 0x00f2fe,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.8
            });
            cursorMesh = new THREE.Mesh(cursorGeo, cursorMat);
            cursorMesh.visible = false;
            scene.add(cursorMesh);

            // WebXR標準コントローラー + 画面直接タッチの両方で確実に検知させる
            controller = renderer.xr.getController(0);
            controller.addEventListener('selectstart', onStartDraw);
            controller.addEventListener('selectend', onEndDraw);
            scene.add(controller);

            overlay.addEventListener('pointerdown', (e) => {
                if (e.target === overlay) onStartDraw();
            });
            overlay.addEventListener('pointerup', onEndDraw);
            overlay.addEventListener('pointercancel', onEndDraw);

            // ボタン上のタッチが描画イベントに邪魔されないようにする
            const controls = document.getElementById('controls');
            controls.addEventListener('pointerdown', (e) => e.stopPropagation());
            controls.addEventListener('touchstart', (e) => e.stopPropagation());

            // 色：白
            document.getElementById('btn-white').addEventListener('click', () => {
                currentColor = 0xffffff;
                isNeon = false;
                setActiveColor('btn-white');
                finishCurrentLine();
            });

            // 色：黒
            document.getElementById('btn-black').addEventListener('click', () => {
                currentColor = 0x222222;
                isNeon = false;
                setActiveColor('btn-black');
                finishCurrentLine();
            });

            // 色：光る線
            document.getElementById('btn-neon').addEventListener('click', () => {
                currentColor = 0x00f2fe;
                isNeon = true;
                setActiveColor('btn-neon');
                finishCurrentLine();
            });

            // 太さ：細
            document.getElementById('size-thin').addEventListener('click', () => {
                currentLineWidth = 0.008;
                setActiveSize('size-thin');
                finishCurrentLine();
            });

            // 太さ：中
            document.getElementById('size-mid').addEventListener('click', () => {
                currentLineWidth = 0.015;
                setActiveSize('size-mid');
                finishCurrentLine();
            });

            // 太さ：太
            document.getElementById('size-thick').addEventListener('click', () => {
                currentLineWidth = 0.03;
                setActiveSize('size-thick');
                finishCurrentLine();
            });

            // 消去
            document.getElementById('clear-btn').addEventListener('click', () => {
                finishCurrentLine();
                while (linesGroup.children.length > 0) {
                    const obj = linesGroup.children[0];
                    linesGroup.remove(obj);
                    if (obj.geometry) obj.geometry.dispose();
                    if (obj.material) obj.material.dispose();
                }
            });

            window.addEventListener('resize', onWindowResize);
        }

        function setActiveColor(id) {
            ['btn-white', 'btn-black', 'btn-neon'].forEach(btnId => {
                document.getElementById(btnId).classList.remove('active');
            });
            document.getElementById(id).classList.add('active');
        }

        function setActiveSize(id) {
            ['size-thin', 'size-mid', 'size-thick'].forEach(btnId => {
                document.getElementById(btnId).classList.remove('active');
            });
            document.getElementById(id).classList.add('active');
        }

        function getPenTipPosition() {
            const position = new THREE.Vector3();
            const quaternion = new THREE.Quaternion();
            const scale = new THREE.Vector3();

            camera.matrixWorld.decompose(position, quaternion, scale);
            const offset = new THREE.Vector3(0, 0, -0.25);
            offset.applyQuaternion(quaternion);
            position.add(offset);
            return position;
        }

        function onStartDraw() {
            if (!renderer.xr.isPresenting) return;
            isDrawing = true;
            ribbonPoints = [];
            const p = getPenTipPosition();
            ribbonPoints.push(p);
        }

        function onEndDraw() {
            isDrawing = false;
            currentRibbonMesh = null;
            ribbonPoints = [];
        }

        function finishCurrentLine() {
            currentRibbonMesh = null;
            ribbonPoints = [];
        }

        function updateFlatSquareLine() {
            if (!isDrawing) return;

            const newPoint = getPenTipPosition();
            if (ribbonPoints.length > 0) {
                const lastPoint = ribbonPoints[ribbonPoints.length - 1];
                if (newPoint.distanceTo(lastPoint) < 0.004) return;
            }

            ribbonPoints.push(newPoint.clone());
            if (ribbonPoints.length < 2) return;

            if (currentRibbonMesh) {
                linesGroup.remove(currentRibbonMesh);
                currentRibbonMesh.geometry.dispose();
            }

            const width = isNeon ? currentLineWidth * 2.8 : currentLineWidth;
            const positions = [];
            const uvs = [];
            const indices = [];

            const camPos = new THREE.Vector3();
            camera.getWorldPosition(camPos);

            for (let i = 0; i < ribbonPoints.length; i++) {
                const p = ribbonPoints[i];
                const tangent = new THREE.Vector3();
                if (i < ribbonPoints.length - 1) {
                    tangent.subVectors(ribbonPoints[i + 1], p).normalize();
                } else {
                    tangent.subVectors(p, ribbonPoints[i - 1]).normalize();
                }

                const toCamera = new THREE.Vector3().subVectors(camPos, p).normalize();
                const side = new THREE.Vector3().crossVectors(tangent, toCamera).normalize();
                if (side.lengthSq() === 0) side.set(1, 0, 0);

                const left = p.clone().addScaledVector(side, -width / 2);
                const right = p.clone().addScaledVector(side, width / 2);

                positions.push(left.x, left.y, left.z);
                positions.push(right.x, right.y, right.z);

                const v = i / (ribbonPoints.length - 1);
                uvs.push(0, v);
                uvs.push(1, v);

                if (i < ribbonPoints.length - 1) {
                    const base = i * 2;
                    indices.push(base, base + 1, base + 2);
                    indices.push(base + 1, base + 3, base + 2);
                }
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
            geometry.setIndex(indices);
            geometry.computeVertexNormals();

            let material;
            if (isNeon) {
                material = new THREE.MeshBasicMaterial({
                    map: neonTexture,
                    transparent: true,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false,
                    side: THREE.DoubleSide
                });
            } else {
                material = new THREE.MeshBasicMaterial({
                    color: currentColor,
                    side: THREE.DoubleSide
                });
            }

            currentRibbonMesh = new THREE.Mesh(geometry, material);
            linesGroup.add(currentRibbonMesh);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render() {
            if (renderer.xr.isPresenting) {
                const tipPos = getPenTipPosition();
                cursorMesh.visible = true;
                cursorMesh.position.copy(tipPos);

                const camPos = new THREE.Vector3();
                camera.getWorldPosition(camPos);
                cursorMesh.lookAt(camPos);

                cursorMesh.scale.set(currentLineWidth * 100, currentLineWidth * 100, 1);

                if (isDrawing) {
                    cursorMesh.material.color.setHex(isNeon ? 0xffffff : (currentColor === 0xffffff ? 0x00f2fe : 0xff3b30));
                    updateFlatSquareLine();
                } else {
                    cursorMesh.material.color.setHex(0x00f2fe);
                }
            } else {
                cursorMesh.visible = false;
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
