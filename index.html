<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Web AR Drawing</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }
        #video-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            pointer-events: none;
        }
        #clear-btn {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: #ff3b30;
            color: #white;
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="ui">画面をなぞって空間に線を描こう</div>
    <video id="video-background" autoplay playsinline muted></video>
    <button id="clear-btn">すべて消去</button>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer;
        let isDrawing = false;
        let currentLineMesh = null;
        let pointsArray = [];
        const linesGroup = new THREE.Group();

        init();
        animate();

        function init() {
            // 1. カメラ映像のセットアップ（背面カメラを優先）
            const video = document.getElementById('video-background');
            navigator.mediaDevices.getUserMedia({
                video: { facingMode: { exact: "environment" } }
            }).catch(() => {
                // 背面カメラが取れない場合は前面や利用可能なカメラにフォールバック
                return navigator.mediaDevices.getUserMedia({ video: true });
            }).then(stream => {
                video.srcObject = stream;
            }).catch(err => {
                console.error("カメラの起動に失敗しました: ", err);
                alert("カメラの許可が必要です。");
            });

            // 2. Three.js シーンの初期化
            scene = new THREE.Scene();
            scene.add(linesGroup);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 5);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            // 3. ライトの追加
            const light = new THREE.DirectionalLight(0xffffff, 1);
            light.position.set(0, 10, 5).normalize();
            scene.add(light);
            scene.add(new THREE.AmbientLight(0xffffff, 0.5));

            // 4. イベントリスナー（タッチ & マウス対応）
            window.addEventListener('resize', onWindowResize);

            const canvas = renderer.domElement;
            canvas.addEventListener('pointerdown', onPointerDown);
            canvas.addEventListener('pointermove', onPointerMove);
            canvas.addEventListener('pointerup', onPointerUp);

            // クリアボタン
            document.getElementById('clear-btn').addEventListener('click', () => {
                while(linesGroup.children.length > 0){
                    const obj = linesGroup.children[0];
                    linesGroup.remove(obj);
                    if (obj.geometry) obj.geometry.dispose();
                    if (obj.material) obj.material.dispose();
                }
            });
        }

        function getNormalizedCoord(event) {
            const x = (event.clientX / window.innerWidth) * 2 - 1;
            const y = -(event.clientY / window.innerHeight) * 2 + 1;
            return { x, y };
        }

        function createPointInSpace(clientX, clientY) {
            const coord = getNormalizedCoord({ clientX, clientY });
            // 画面上の座標を3D空間（カメラの少し前方の平面）に変換
            const vector = new THREE.Vector3(coord.x, coord.y, 0.5);
            vector.unproject(camera);
            return vector;
        }

        function onPointerDown(event) {
            isDrawing = true;
            pointsArray = [];
            const p = createPointInSpace(event.clientX, event.clientY);
            pointsArray.push(p);
            // 線の太さを出すために最低2点必要なので複製しておく
            pointsArray.push(p.clone().add(new THREE.Vector3(0.001, 0.001, 0)));

            updateCurrentLine();
        }

        function onPointerMove(event) {
            if (!isDrawing) return;
            const p = createPointInSpace(event.clientX, event.clientY);
            pointsArray.push(p);

            updateCurrentLine();
        }

        function onPointerUp(event) {
            isDrawing = false;
        }

        function updateCurrentLine() {
            if (pointsArray.length < 2) return;

            // 既存のメッシュがあれば削除して更新
            if (currentLineMesh) {
                linesGroup.remove(currentLineMesh);
                currentLineMesh.geometry.dispose();
            }

            // カーブとチューブジオメトリを使って立体的な線にする
            const curve = new THREE.CatmullRomCurve3(pointsArray);
            const geometry = new THREE.TubeGeometry(curve, pointsArray.length * 2, 0.04, 8, false);
            const material = new THREE.MeshStandardMaterial({ 
                color: 0x00f2fe, 
                roughness: 0.2,
                metalness: 0.8
            });

            currentLineMesh = new THREE.Mesh(geometry, material);
            linesGroup.add(currentLineMesh);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
